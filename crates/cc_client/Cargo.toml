[package]
name = "cc_client"
version = "0.1.0"
edition = "2024"

[features]
default = ["native"]
native = ["dep:cc_agent", "dep:cc_voice"]
wasm-agent = ["dep:cc_agent"]

[dependencies]
cc_core = { path = "../cc_core", features = ["bevy"] }
cc_sim = { path = "../cc_sim" }
cc_voice = { path = "../cc_voice", optional = true }
cc_agent = { path = "../cc_agent", optional = true }
bevy = { workspace = true }
ron = { workspace = true }
serde = { workspace = true }

[[example]]
name = "poc_3d"
required-features = []

# Headless validator for the Strait Prelude — runs the actual `dream_strait`
# simulation systems against `dream_strait_prelude.ron` without a window or
# input, dumps drone counts at intervals, and asserts the mission failure
# trigger fires within a tick budget. See `src/bin/prelude_harness.rs`.
[[bin]]
name = "prelude_harness"
path = "src/bin/prelude_harness.rs"
required-features = ["native"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { workspace = true, features = ["webgl2"] }
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
